<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="emailModalHeading" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 id="emailModalHeading" class="slds-modal__title slds-hyphenate">Send Certificates by Email</h2>
                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleEmailModalClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                </button>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-input label="CC Email (optional)" value={ccEmailValue} onchange={handleCcEmailChange}></lightning-input>
                <div style="max-height:300px;overflow:auto;" class="custom-table-container slds-m-top_medium">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead class="slds-text-title_caps slds-box" style="background-color: ghostwhite; position: sticky; top: 0; z-index: 1;">
                            <tr class="slds-line-height_reset" >
                                <th class="custom-table-header"></th>
                                <th class="custom-table-header">Specialist Name</th>
                                <th class="custom-table-header">Email</th>
                                <th class="custom-table-header">Certificate</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={emailModalSpecialists} for:item="spec">
                                <tr key={spec.regId}>
                                    <td>
                                        <lightning-input type="checkbox"
                                            checked={spec.checked}
                                            data-regid={spec.regId}
                                            onchange={handleSpecialistCheckboxChange}>
                                        </lightning-input>
                                    </td>
                                    <td>{spec.name}</td>
                                    <td>{spec.email}</td>
                                    <!-- <td>{spec.certification}</td> -->
                                    <td>
                                        <a href="javascript:void(0);" data-id={spec.Id} onclick={handleViewCertificateAction}>View</a>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button variant="neutral" label="Cancel" onclick={handleEmailModalClose} class="slds-m-right_medium"></lightning-button>
                <lightning-button variant="brand" label="Send Email" onclick={handleSendEmailCertificates}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
